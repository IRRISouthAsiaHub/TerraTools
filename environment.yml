# environment.yml — Isolated R environment for TerraTools.
#
# This does NOT install R system-wide. It creates a private, self-contained
# R installation inside this project (see setup_r_env.sh), so it can't
# conflict with any other R version on your machine and doesn't need
# admin/sudo access.
#
# To add more packages later (e.g. for the QTL tool), just add them to the
# list below and re-run: conda env update -f environment.yml -p ./r_env

name: terratools-r
channels:
  - conda-forge
dependencies:
  # Windows ships R 4.6.x. On macOS arm64, 4.5 is the newest R for which
  # conda-forge has builds of every package below (checked Sept 2026).
  - r-base=4.5
  - r-readr
  - r-dplyr
  - r-tidyr
  - r-ggplot2
  - r-stringr
  - r-purrr
  - r-scales
  - r-jsonlite
  # Added for the Phenotypic Data Analysis tool:
  - r-tidyverse
  - r-readxl
  - r-lme4
  - r-emmeans
  - r-plotly
  - r-htmlwidgets
  - r-ggally
  - r-corrplot
  - r-car
  - r-broom
  - r-cluster
  - r-factoextra
  - r-pheatmap
  - r-rcolorbrewer
  - r-moments
  - r-reshape2
  - r-gridextra
  - r-openxlsx
  - r-ragg
  - r-pbkrtest
  - r-tibble
  - r-nloptr
  - r-lmertest
  - r-viridislite
  - r-rrblup
  - r-ggpubr
  - r-writexl
  # Used by the R backends but previously missing here:
  - r-ggrepel
  # Balloon heatmap of the Favourable Allele Analysis tool (tools/favourable_allele/backend/balloon_heatmap.R):
  - r-ggtext
  - r-patchwork
  - r-caret

  # ── Packages conda-forge doesn't provide ────────────────────────────────
  # sommer (and its dependency enhancer) aren't on conda-forge at all, and
  # agricolae's conda build needs AlgDesign, which has no macOS arm64 build.
  # These four are compiled from CRAN after the environment is created
  # (build_macos/build_macos.sh does this automatically):
  #     install.packages(c("AlgDesign", "enhancer", "agricolae", "sommer", "mrMLM", "CMplot"))
  # mrMLM (with lars, ncvreg, sampling, sbl, BEDMatrix, coin, data.table, doParallel, foreach and Rcpp, which install
  # as its dependencies) runs the mrMLM and FASTmrMLM models of the GWAS tool. CMplot draws the circular Manhattan and QQ figures
  # (the built-in matplotlib figures are used when it is missing).
  # Their dependencies that ARE on conda-forge come from here:
  - r-rcpp
  - r-rcpparmadillo
  - r-rcppprogress
  - r-crayon
  - r-matrix
  - r-mass
  - r-nlme
  # C/C++/Fortran toolchain + make, needed to compile the CRAN packages above.
  - compilers
  - make
