name: Build macOS app

# Manual trigger only. Produces installer_output/TerraTools.dmg as a
# downloadable workflow artifact — useful if you don't have a Mac handy,
# since PyInstaller/TensorFlow/PySide6 all need to build natively on
# macOS (this repo cannot be built into a macOS app from Windows).
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (arm64) runner
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        shell: bash -l {0}
        run: bash build_macos/build_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: TerraTools-macOS
          path: installer_output/TerraTools.dmg
